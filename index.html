<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Untuk Saskia ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow: hidden;
    }

    .container {
      width: 90%;
      max-width: 600px;
      padding: 30px;
      text-align: center;
      background: rgba(255,255,255,0.88);
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
      z-index: 2;
    }

    h1 {
      color: #e63964;
      margin-bottom: 10px;
    }

    .message {
      color: #555;
      font-size: 17px;
      margin-bottom: 25px;
      font-style: italic;
    }

    button {
      border: none;
      padding: 15px 28px;
      border-radius: 30px;
      background: #e63964;
      color: white;
      font-size: 17px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.08);
    }

    #messages {
      margin-top: 20px;
      max-height: 300px;
      overflow-y: auto;
      text-align: left;
    }

    .love {
      color: #e63964;
      font-weight: bold;
      margin: 5px 0;
      animation: appear 0.4s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .heart {
      position: fixed;
      bottom: -30px;
      font-size: 25px;
      animation: float 5s linear forwards;
      opacity: 0.7;
    }

    @keyframes float {
      to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Untuk Kamu, Saskia. ❤️</h1>

    <div class="message">
      Мне посчастливилось быть твоей любовью.
    </div>

    <button onclick="showLove()">
      Klik Disini ❤️
    </button>

    <div id="messages"></div>

  </div>

  <script>
    function showLove() {

      const messages = document.getElementById("messages");

      // Mencegah pesan muncul dua kali
      if (messages.children.length > 0) return;

      // Menampilkan I love you sebanyak 100 kali
      for (let i = 1; i <= 100; i++) {

        const text = document.createElement("div");

        text.className = "love";
        text.innerHTML = `❤️ I love you — ${i}/100`;

        messages.appendChild(text);
      }

      // Membuat hati beterbangan
      for (let i = 0; i < 25; i++) {

        setTimeout(() => {

          const heart = document.createElement("div");

          heart.className = "heart";
          heart.innerHTML = "❤️";

          heart.style.left = Math.random() * 100 + "vw";

          heart.style.animationDuration =
            (3 + Math.random() * 3) + "s";

          document.body.appendChild(heart);

          setTimeout(() => {
            heart.remove();
          }, 6000);

        }, i * 100);
      }
    }
  </script>

</body>
</html>
